include dracula.conf
enabled_layouts Fat:bias=60, Stack

cursor_shape              block
shell_integration         no-cursor
inactive_border_color     #404060
background                #1f2329
window_padding_width      2

tab_bar_min_tabs          1
tab_bar_edge              top
tab_bar_style             powerline
inactive_tab_foreground   #fff
inactive_tab_background   #404060
active_tab_foreground     #fff
active_tab_background     #333350
tab_bar_background        #282d35
tab_bar_margin_color      #1f2329
tab_bar_margin_width      0.5
tab_bar_margin_height     4.0 1.0

kitty_mod alt

map kitty_mod+m layout_action bias 60 50 40
map kitty_mod+i next_layout

map kitty_mod+o new_tab
map kitty_mod+k next_tab
map kitty_mod+j previous_tab

map kitty_mod+n new_window
map kitty_mod+h previous_window
map kitty_mod+l next_window
map kitty_mod+' close_window

map kitty_mod+shift+j move_tab_backward
map kitty_mod+shift+k move_tab_forward
map kitty_mod+shift+h move_window_backward
map kitty_mod+shift+l move_window_forward

map ctrl+backspace send_text all \u0017
map ctrl+delete    send_text all \u001bd
