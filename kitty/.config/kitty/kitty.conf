include dracula.conf
enabled_layouts Fat:bias=60, Tall:bias=40
enable_audio_bell no

cursor_shape              block
touch_scroll_multiplier   10.0
shell_integration         no-cursor
inactive_border_color     #404060
background                #1f2329
window_padding_width      2

tab_bar_min_tabs          1
tab_bar_edge              top
tab_bar_style             powerline

inactive_tab_background   #908989
inactive_tab_foreground   #2e2430
active_tab_background     #6887cf
active_tab_foreground     #2e2430
tab_bar_background        #1f2329
tab_bar_margin_color      #1f2329
tab_bar_margin_width      0.5
tab_bar_margin_height     4.0 1.0
tab_title_template " \uf07b  {title} "

map alt+; next_layout
map shift+alt+; layout_action bias 60 50 40

map alt+o new_tab
map alt+j previous_tab
map alt+k next_tab

map alt+i new_window
map alt+h previous_window
map alt+l next_window
map alt+' close_window

map shift+alt+h move_window_backward
map shift+alt+j move_tab_backward
map shift+alt+k move_tab_forward
map shift+alt+l move_window_forward
